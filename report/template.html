<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>court — {DATE}</title>
<style>
  :root {
    --bg:#14151a; --panel:#1c1e26; --line:#2c2f3a; --txt:#e6e7eb;
    --dim:#9aa0ae; --hot:#e0663c; --mid:#d6a94e; --cool:#5a8fb0; --ok:#5aa36a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; }
  .wrap { max-width:940px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:20px; margin:0 0 2px; }
  h2 { font-size:15px; margin:34px 0 12px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; }
  .stat .n { font-size:24px; font-weight:600; }
  .stat .l { color:var(--dim); font-size:12px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line);
    vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; margin-bottom:10px; }
  .card .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-bottom:6px; }
  .tag { font-size:12px; padding:1px 8px; border-radius:20px; border:1px solid var(--line);
    color:var(--dim); }
  .heat { font-weight:600; }
  .h-hi { color:var(--hot); } .h-mid { color:var(--mid); } .h-lo { color:var(--cool); }
  .pending { color:var(--dim); font-style:italic; }
  .evi { color:var(--dim); font-size:13px; white-space:pre-wrap;
    border-left:2px solid var(--line); padding-left:10px; margin-top:6px; }
  .muted { color:var(--dim); }
  /* incident table */
  table.inc { font-size:13px; }
  table.inc th { cursor:pointer; user-select:none; white-space:nowrap; }
  table.inc th:hover { color:var(--txt); }
  table.inc th.sorted::after { content:" ↓"; }
  table.inc th.sorted.asc::after { content:" ↑"; }
  table.inc tbody tr.row { cursor:pointer; }
  table.inc tbody tr.row:hover td { background:#20222b; }
  table.inc td.temp { font-weight:600; font-variant-numeric:tabular-nums; }
  tr.detail { display:none; }
  tr.detail.open { display:table-row; }
  tr.detail td { background:#181a21; color:var(--dim); }
  tr.detail .evi { margin:4px 0; }
  .inc-item { padding:8px 0; border-top:1px solid var(--line); }
  .inc-item:first-child { border-top:0; }
  .inc-hd { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px; }
  .inc-hd .temp { font-size:13px; }
  .pivots { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .pivot h3 { font-size:12px; color:var(--dim); margin:0 0 6px; font-weight:500;
    text-transform:uppercase; letter-spacing:.05em; }
  .pivot table { font-size:13px; }
  .pivot td.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>court</h1>
  <div class="sub">{DATE}</div>
  {BODY}
</div>
<script>
// row expand
document.querySelectorAll('table.inc tr.row').forEach(function(r){
  r.addEventListener('click', function(){
    var d = r.nextElementSibling;
    if (d && d.classList.contains('detail')) d.classList.toggle('open');
  });
});
// column sort
document.querySelectorAll('table.inc th[data-key]').forEach(function(th){
  th.addEventListener('click', function(){
    var table = th.closest('table'), tb = table.tBodies[0];
    var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
    var asc = !(th.classList.contains('sorted') && !th.classList.contains('asc'));
    table.querySelectorAll('th').forEach(function(h){ h.classList.remove('sorted','asc'); });
    th.classList.add('sorted'); if (asc) th.classList.add('asc');
    // pair each row with its detail sibling BEFORE moving anything
    var pairs = Array.prototype.map.call(tb.querySelectorAll('tr.row'), function(r){
      var d = r.nextElementSibling;
      return [r, (d && d.classList.contains('detail')) ? d : null];
    });
    var num = th.dataset.type === 'num';
    pairs.sort(function(a, b){
      var av = a[0].children[idx].dataset.sort, bv = b[0].children[idx].dataset.sort;
      if (num) { av = parseFloat(av)||0; bv = parseFloat(bv)||0; return asc ? av-bv : bv-av; }
      return asc ? (''+av).localeCompare(bv) : (''+bv).localeCompare(av);
    });
    pairs.forEach(function(p){ tb.appendChild(p[0]); if (p[1]) tb.appendChild(p[1]); });
  });
});
</script>
</body>
</html>
