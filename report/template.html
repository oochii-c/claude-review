<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-review — {DATE}</title>
<style>
  :root {
    --bg:#14151a; --panel:#1c1e26; --line:#2c2f3a; --txt:#e6e7eb;
    --dim:#9aa0ae; --hot:#e0663c; --mid:#d6a94e; --cool:#5a8fb0; --ok:#5aa36a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; }
  .wrap { max-width:940px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:20px; margin:0 0 2px; }
  h2 { font-size:15px; margin:34px 0 12px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; }
  .stat .n { font-size:24px; font-weight:600; }
  .stat .l { color:var(--dim); font-size:12px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line);
    vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; margin-bottom:10px; }
  .card .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-bottom:6px; }
  .tag { font-size:12px; padding:1px 8px; border-radius:20px; border:1px solid var(--line);
    color:var(--dim); }
  .heat { font-weight:600; }
  .h-hi { color:var(--hot); } .h-mid { color:var(--mid); } .h-lo { color:var(--cool); }
  .pending { color:var(--dim); font-style:italic; }
  .evi { color:var(--dim); font-size:13px; white-space:pre-wrap;
    border-left:2px solid var(--line); padding-left:10px; margin-top:6px; }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>claude-review</h1>
  <div class="sub">{DATE}</div>
  {BODY}
</div>
</body>
</html>
